# rumdl configuration file

[global]
disable = ["MD013"]

exclude = [
  ".agents",
  "CHANGELOG.md",
  "LICENSE.md",
  # Generated by `mise run perf:docs` from tak's git notes; tak owns its shape,
  # including the `<sub>` credit line and the missing top-level heading.
  "docs/perf/history.md",
]

respect-gitignore = true
