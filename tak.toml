# Instruction-counted benchmarks, measured by tak (https://github.com/jdx/tak).
#
# Each subject runs against `benchmarks/fixture`, a committed config and a set of
# stand-in executables, so no subject depends on what happens to be installed or
# which host it runs on: PATH is replaced with the fixture's bin directory, and
# every shcomp directory is redirected into the fixture. That also keeps mise out
# of the measurement — `ls` in v0.0.1 asks mise about packslip ownership, and an
# absent mise is the stable answer.
#
# Replacing PATH also hides valgrind: tak resolves it through the measured
# command's PATH, so a subject that sets one would record wall clock only and
# never gate on instructions. `mise run perf:fixture` puts a wrapper for the
# host's valgrind in the fixture bin for exactly that reason, and both perf
# workflows run it before `tak run`.
#
# Absolute instruction counts are only comparable within one runner class, so the
# workflows pass `runner-class`; this file does not pin one, or a local run would
# be recorded as if it were CI.
#
# The subjects are deliberately three:
#
# - `startup` is the fixed cost every invocation pays: process start, dynamic
#   linking, and building the usage-rs command tree. Reading the others against
#   it separates "shcomp got slower to start" from "this command's path got
#   slower". `--help` does no config work and touches no network. Adding the
#   `search` subcommand grew that tree by 1.2%; #40 carries a `Tak-Accept`
#   trailer for it, because every command added to the tree pays that cost
#   once at startup. `logging` cost another 2.8% (#43): `--help` never installs
#   the subscriber, so that part is the two new global flags in the tree plus
#   the tracing dependency graph enlarging what the dynamic linker resolves
#   before `main` runs. #43 carries a `Tak-Accept` trailer for it as well.
# - `ls` resolves the shipped registry, reads the fixture config, and stats each
#   selected command's cache entry: the read-only path users hit most. v0.0.3's
#   `feat(ls)` layer made the `Cache` column cover zsh and fish, so a tool with a
#   fish source is keyed twice; that cost about 2% even with one stat shared
#   per binary, and the layer carries a `Tak-Accept: ls` trailer for it.
# - `load` is the shim's cold dispatch — the one command a Tab actually forks.
#   Its `setup` prewarms the cache so the measurement is the resolve-and-hit
#   path, not the generator run.
#
# `doctor` is absent on purpose: it probes PATH, mise, and every shim directory,
# so its cost is the machine's, not shcomp's.
#
# No `[gate]` and no `[runner]`: a gate of 1% and a runner class are supplied by
# `.github/workflows/perf.yml` and `perf-pr.yml`, where a comparison actually
# happens.
#
# tak stores its measurements as git notes on `refs/notes/tak`, not as files, and
# it has no setting to point them elsewhere. `docs/perf/README.md` covers the
# store, the snapshot under `docs/perf/`, and how to read a number.

[bench.startup]
cmd = ["./target/release/shcomp", "--help"]

[bench.ls]
cmd = ["./target/release/shcomp", "ls"]
env = { SHCOMP_CONFIG = "benchmarks/fixture/config.toml", SHCOMP_REGISTRY_DIR = "benchmarks/fixture/registry", SHCOMP_CACHE_DIR = "benchmarks/fixture/cache", SHCOMP_DATA_DIR = "benchmarks/fixture/data", PATH = "benchmarks/fixture/bin" }

[bench.load]
cmd = [
  "./target/release/shcomp",
  "load",
  "--shell",
  "zsh",
  "--command",
  "gh",
  "--bin",
  "benchmarks/fixture/bin/gh",
]
env = { SHCOMP_CONFIG = "benchmarks/fixture/config.toml", SHCOMP_REGISTRY_DIR = "benchmarks/fixture/registry", SHCOMP_CACHE_DIR = "benchmarks/fixture/cache", SHCOMP_DATA_DIR = "benchmarks/fixture/data", PATH = "benchmarks/fixture/bin" }
setup = [
  "./target/release/shcomp",
  "load",
  "--shell",
  "zsh",
  "--command",
  "gh",
  "--bin",
  "benchmarks/fixture/bin/gh",
]
