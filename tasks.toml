[bootstrap]
run = ["cargo install"]

[clean]
description = "Clean build artifacts"
run = "cargo clean"

[build]
alias = "b"
run = "{{ get_env(name='MISE_CARGO_BUILD_COMMAND', default='cargo build') }} --all-features {{ get_env(name='MISE_CARGO_BUILD_EXTRA_ARGS', default='') }}"
run_windows = "{{ get_env(name='MISE_CARGO_BUILD_COMMAND', default='cargo build') }} {{ get_env(name='MISE_CARGO_BUILD_EXTRA_ARGS', default='') }}"
description = "Build the project"

[fmt]
description = "Format TOML, Markdown, and Rust files"
alias = ["format"]
run = ["cargo fmt --all -- --check", "rumdl fmt", "tombi format"]

[lint]
description = "Lint TOML, Markdown, and Rust files"
alias = ["check"]
run = ["rumdl check", "tombi check", "cargo check --all-features"]

[perf]
description = "Benchmark instruction counts against the recorded baseline"
dir = "{{config_root}}"
run = ["cargo build --release --locked", "tak run"]

["perf:record"]
description = "Benchmark and append this commit to refs/notes/tak"
dir = "{{config_root}}"
run = ["cargo build --release --locked", "tak run --record"]

["perf:docs"]
description = "Refresh the committed history snapshot under docs/perf"
dir = "{{config_root}}"
run = [
  "tak log > docs/perf/history.md",
  "tak log --html docs/perf/history.html",
]

[test]
description = "run all tests"
alias = "t"
run = ["mise tasks run test:unit", "mise tasks run test:e2e --all"]

["test:unit"]
description = "run unit tests"
run = "cargo test --all-features --workspace"
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

[render]
description = "Run all render tasks"
depends = ["render:*"]

["render:usage"]
description = "Generate usage documentation"
depends = ["build"]
run = ["shcomp usage > shcomp.usage.kdl"]

["render:completions"]
description = "Generate shell completions"
depends = ["build"]
wait_for = ["render:usage"]
env = { NO_COLOR = "1" }
run = '''
#!/usr/bin/env bash
set -xeuo pipefail
shcomp completion bash > completions/shcomp.bash
shcomp completion zsh > completions/_shcomp
shcomp completion fish > completions/shcomp.fish
shcomp completion powershell > completions/shcomp.ps1
'''

["render:schema"]
description = "Generate JSON Schema files"
depends = ["build"]
run = [
  "mkdir -p schema",
  "shcomp schema > schema/config.json",
  "shcomp schema --registry > schema/registry.json",
]

["render:mangen"]
description = "Generate man pages"
depends = ["render:usage"]
env = { NO_COLOR = "1" }
run = [
  "mise x usage -- usage generate manpage --file shcomp.usage.kdl > man/man1/shcomp.1",
]
