# CI-only releases. A release PR adds release.json, docs/releases/<version>.md,
# a CHANGELOG entry, and the Cargo.toml/Cargo.lock bump. On merge this workflow
# builds the matrix, creates a draft GitHub release, signs it with keyless
# packslip, and publishes it.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Validate release manifest
        run: mise run release:check

      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          release=false
          version=""
          tag=""
          if [[ ! -f release.json ]]; then
            echo "No release.json; skipping release."
          else
            version="$(jq -r '.version' release.json)"
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists; skipping release."
            else
              release=true
            fi
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            triple: aarch64-unknown-linux-gnu
          # macOS runners are not available to this repository yet. Add the
          # darwin triples back (and man@darwin to packslip-sign.yml) when
          # runner access is enabled.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Install cross linker
        if: matrix.triple == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross linker
        if: matrix.triple == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >>"$GITHUB_ENV"

      - run: rustup target add ${{ matrix.triple }}

      - run: mise run release:assets

      - run: mise run release:tarball ${{ matrix.triple }}

      - uses: actions/upload-artifact@v7
        with:
          name: shcomp-${{ matrix.triple }}
          path: dist/*.tar.gz

  release:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name '*.tar.gz' -exec cp -t dist {} +
          mise run release:assets
          mise run release:checksums

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --draft \
              --title "$TAG" \
              --notes-file "docs/releases/$VERSION.md" \
              --target "$GITHUB_SHA"
          fi

  sign:
    needs: [check, release]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/packslip-sign.yml
    with:
      tag: ${{ needs.check.outputs.tag }}

  publish:
    needs: [check, sign]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
