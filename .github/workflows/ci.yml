name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(github.event.pull_request.labels.*.name, 'full-shell-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # The standard runner image has no zsh. E2E tests requiring zsh are
      # skipped by their own guards unless this slower coverage is requested.
      # Main-branch runs always install it so merged changes get full coverage.
      - name: Install zsh
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-shell-tests')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: mise run lint

      - name: Tests
        run: mise run test

      - name: Release manifest
        run: mise run release:check
