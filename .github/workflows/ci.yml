name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # The e2e suite drives real zsh completions, and GitHub's runner image
      # ships neither zsh nor a mise recipe for it, so install it explicitly.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: mise run lint

      - name: Tests
        run: mise run test

      - name: Release manifest
        run: mise run release:check
